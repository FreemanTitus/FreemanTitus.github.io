<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a2b5b">
    <title>Royal Bank</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/584/584011.png">

    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker Registered'))
            .catch(err => console.log('Service Worker Failed', err));
        });
    }
    </script>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="top-nav">
                <i class="ph ph-list text-white"></i>
            </div>
            
            <div class="greeting-container">
                <h1 class="greeting">Hi there</h1>
                <div class="profile-circle">R</div>
            </div>
            <p class="section-label">Accounts</p>

            <div class="account-card">
                <div class="acc-info">
                    <span class="acc-title">Bills</span>
                    <span class="acc-id">x51</span>
                </div>
                <div class="acc-balance">
                    <span class="amount">$57.00</span>
                    <span class="status">Available</span>
                </div>
            </div>

            <div class="account-card">
                <div class="acc-info">
                    <span class="acc-title">Christmas Savings</span>
                    <span class="acc-id">x51</span>
                </div>
                <div class="acc-balance">
                    <span class="amount">$43.00</span>
                    <span class="status">Available</span>
                </div>
            </div>

            <div class="actions">
                <div class="action-item"><div class="icon-box"><i class="ph ph-arrows-left-right"></i></div><span>Transfer</span></div>
                <div class="action-item"><div class="icon-box"><i class="ph ph-download-simple"></i></div><span>Deposit</span></div>
                <div class="action-item"><div class="icon-box"><i class="ph ph-currency-dollar"></i></div><span>Pay</span></div>
                <div class="action-item"><div class="icon-box"><i class="ph ph-chat-centered-text"></i></div><span>Message</span></div>
            </div>
        </header>

        <main class="transactions-sheet">
            <div class="sheet-header">
                <h3>Transactions</h3>
                <div class="sheet-icons">
                    <i class="ph ph-magnifying-glass"></i>
                    <i class="ph ph-dots-three-outline"></i>
                </div>
            </div>
            <div id="transaction-list">
                </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
